<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PAINT_UNIT · Demien Rapp</title>

    <!-- MANUAL: self-hosted verlangt. Beim Deploy dieses CDN gegen eigene @font-face tauschen. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;600&family=JetBrains+Mono:wght@500;700&family=Silkscreen&display=swap" rel="stylesheet">

    <style>
        :root {
            --paper: #F2F0EB;
            --ink: #0B0B0C;
            --muted: #56565B;
            --line: #D7D4CC;
            --hi: #000000;
            --ink-raise: #E8E5DD;
            --line-soft: #E3E0D8;
            --invert-bg: #0B0B0C;
            --invert-fg: #F2F0EB;

            --container: 1240px;
            --gutter: clamp(18px, 4vw, 56px);
            --ease-out: cubic-bezier(.16, 1, .3, 1);
            --speed: 0.5s;

            --font-display: 'Bricolage Grotesque', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --font-pixel: 'Silkscreen', monospace;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body { margin: 0; }

        body {
            background: var(--paper);
            color: var(--ink);
            font-family: var(--font-body);
            font-size: clamp(0.95rem, 0.9rem + 0.3vw, 1.05rem);
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
        }

        /* ---- INVERTIERTER BLOCK (genau 1x pro Seite) ---- */
        .topbar {
            background: var(--invert-bg);
            color: var(--invert-fg);
            padding: clamp(20px, 3vw, 34px) var(--gutter);
        }
        .topbar-inner {
            max-width: var(--container);
            margin: 0 auto;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }
        .brand {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: clamp(2.2rem, 7vw, 5.5rem);
            line-height: 0.88;
            letter-spacing: -0.03em;
            margin: 0;
            text-transform: uppercase;
            overflow-wrap: anywhere;
        }
        .brand-meta {
            font-family: var(--font-mono);
            font-weight: 500;
            font-size: clamp(0.72rem, 0.7rem + 0.2vw, 0.82rem);
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: rgba(242, 240, 235, 0.55);
            margin: 0;
        }
        .pixel {
            font-family: var(--font-pixel);
            font-size: 0.66em;
            color: var(--invert-fg);
            letter-spacing: 0;
        }

        /* Glitch nur bei Load + Hover, aus bei reduced-motion */
        @media (prefers-reduced-motion: no-preference) {
            .brand { animation: glitch var(--speed) var(--ease-out) both; }
            .topbar:hover .brand { animation: glitch var(--speed) var(--ease-out); }
            @keyframes glitch {
                0%   { transform: translateX(0); text-shadow: none; }
                18%  { transform: translateX(-3px); text-shadow: 3px 0 var(--paper), -3px 0 var(--invert-bg); }
                36%  { transform: translateX(2px); text-shadow: -2px 0 var(--paper); }
                54%  { transform: translateX(-1px); text-shadow: 2px 0 var(--paper); }
                100% { transform: translateX(0); text-shadow: none; }
            }
        }

        /* ---- LAYOUT ---- */
        .container {
            max-width: var(--container);
            margin: 0 auto;
            padding: clamp(28px, 5vw, 64px) var(--gutter) clamp(40px, 6vw, 96px);
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: clamp(24px, 4vw, 48px);
            align-items: start;
        }

        @media (max-width: 900px) {
            .container {
                display: flex;
                flex-direction: column;
                gap: 24px;
            }
            .viewport { order: 1; }
            .controls, footer { order: 2; }
            canvas { max-height: 50vh; } /* Bild klein halten, Regler bleiben erreichbar */
        }

        /* ---- VIEWPORT ---- */
        .viewport {
            width: 100%;
            background: var(--ink-raise);
            border: 1px solid var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 280px;
            overflow: hidden;
            position: sticky;
            top: 12px;
        }
        canvas {
            max-width: 100%;
            height: auto;
            max-height: 80vh;
            image-rendering: pixelated;
            display: block;
            cursor: crosshair;
            touch-action: none; /* sonst scrollt das handy statt zu malen */
        }

        .rec-indicator {
            position: absolute;
            top: 12px;
            right: 12px;
            display: none;
            align-items: center;
            gap: 8px;
            z-index: 20;
            background: var(--ink);
            color: var(--paper);
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 0.7rem;
            letter-spacing: 0.14em;
            padding: 5px 9px;
        }
        .rec-indicator::before {
            content: "";
            width: 9px;
            height: 9px;
            background: var(--paper);
            animation: blink 1s steps(1) infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* ---- CONTROLS ---- */
        .controls {
            display: flex;
            flex-direction: column;
            gap: clamp(24px, 3vw, 34px);
        }

        .eyebrow {
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: var(--ink);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .eyebrow::before {
            content: "";
            width: 24px;
            height: 1px;
            background: var(--ink);
            flex: none;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            margin-bottom: 18px;
        }
        .control-header {
            display: flex;
            justify-content: space-between;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
        }
        .control-header .val { color: var(--ink); font-weight: 700; }

        /* ---- SLIDERS (monochrom, radius 0) ---- */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 1px;
            background: var(--line);
            outline: none;
            margin: 16px 0;
            touch-action: pan-y;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 44px;
            height: 22px;
            background: var(--ink);
            border: 1px solid var(--paper);
            border-radius: 0;
            cursor: pointer;
        }
        input[type="range"]::-moz-range-thumb {
            width: 44px;
            height: 22px;
            background: var(--ink);
            border: 1px solid var(--paper);
            border-radius: 0;
            cursor: pointer;
        }
        input[type="range"]:active::-webkit-slider-thumb { background: var(--paper); border-color: var(--ink); }
        input[type="range"]:active::-moz-range-thumb { background: var(--paper); border-color: var(--ink); }
        input[type="range"]:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

        /* ---- BUTTONS ---- */
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        button, .file-label {
            background: var(--paper);
            color: var(--ink);
            border: 1px solid var(--ink);
            border-radius: 0;
            padding: 14px;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            cursor: pointer;
            text-align: center;
            display: block;
            min-height: 46px;
            transition: background var(--speed) var(--ease-out), color var(--speed) var(--ease-out);
        }
        button:hover, .file-label:hover { background: var(--ink); color: var(--paper); }
        button:focus-visible, .file-label:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
        button.active { background: var(--ink); color: var(--paper); }
        button#btn-rec.recording { background: var(--ink); color: var(--paper); }
        button:disabled { opacity: 0.35; cursor: not-allowed; }
        button:disabled:hover { background: var(--paper); color: var(--ink); }

        .full-width { grid-column: span 2; }

        /* file-input nicht display:none -> sonst nicht per tab erreichbar. */
        .file-label { position: relative; }
        .file-label input[type="file"] {
            position: absolute;
            width: 1px; height: 1px;
            margin: -1px; padding: 0; border: 0;
            opacity: 0;
            overflow: hidden;
        }
        .file-label:focus-within { outline: 2px solid var(--ink); outline-offset: 3px; }

        footer {
            grid-column: 1 / -1;
            margin-top: 8px;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--muted);
            border-top: 1px solid var(--line);
            padding-top: 16px;
        }
        footer a {
            color: var(--ink);
            text-decoration: none;
            border-bottom: 1px solid var(--ink);
            transition: background var(--speed) var(--ease-out), color var(--speed) var(--ease-out);
        }
        footer a:hover { background: var(--ink); color: var(--paper); }
    </style>
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <h1 class="brand">Paint<span class="pixel">_</span>Unit</h1>
    </div>
</header>

<main class="container">
    <!-- LINKS: BILD -->
    <section class="viewport" id="viewport">
        <div id="rec-ui" class="rec-indicator">REC</div>
        <canvas id="output-canvas"></canvas>
    </section>

    <!-- RECHTS: PARAMETER -->
    <aside class="controls">
        <div>
            <div class="eyebrow">Source</div>
            <div class="button-group">
                <label class="file-label">
                    Import Source
                    <input type="file" id="file-input" accept="image/*">
                </label>
                <button id="btn-reset">Reset Canvas</button>
            </div>
        </div>

        <div>
            <div class="eyebrow">Paint</div>
            <div class="button-group">
                <button data-mode="smear" class="active">Smear</button>
                <button data-mode="slide">Slide</button>
                <button data-mode="stamp" class="full-width">Stamp</button>
            </div>
            <div class="control-item" style="margin-top:18px">
                <div class="control-header"><span>Brush_Size</span><span class="val" id="v-brush">48</span></div>
                <input type="range" id="s-brush" min="4" max="200" value="48" aria-label="Brush_Size">
            </div>
        </div>

        <div>
            <div class="eyebrow">Output</div>
            <div class="button-group">
                <button id="btn-save">Save Still (PNG)</button>
                <button id="btn-rec">Record Video</button>
            </div>
        </div>
    </aside>

    <footer>
        THIS WAS MADE BY <a href="https://rappde.com" target="_blank" rel="noopener">RAPPDE.COM</a>
    </footer>
</main>

<script>
    const canvas = document.getElementById('output-canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const fileInput = document.getElementById('file-input');
    const btnRec = document.getElementById('btn-rec');

    // rotations-framebuffer fuer smear/slide
    const fb = document.createElement('canvas');
    const ftx = fb.getContext('2d');
    // stamp-buffer, haelt den fleck vom pointerdown
    const buf = document.createElement('canvas');
    const btx = buf.getContext('2d');

    // captureStream fehlt z.B. auf iOS Safari -> Aufnahme dort ehrlich deaktivieren
    const recSupported = typeof canvas.captureStream === 'function' && typeof window.MediaRecorder === 'function';
    if (!recSupported) {
        btnRec.disabled = true;
        btnRec.textContent = 'Rec N/A';
    }

    // Mobil weniger interne Auflösung -> spürbar flüssiger bei gleichem Look
    const RES_LIMIT = (window.matchMedia('(pointer: coarse)').matches
        || window.matchMedia('(max-width: 900px)').matches) ? 720 : 1200;

    const sliders = {
        brush: document.getElementById('s-brush')
    };

    let sourceMode = 'none';
    let currentImage = null;
    let currentURL = null;
    let mode = 'smear';
    let mediaRecorder, recordedChunks = [];

    let W, H, FB, offX, offY;

    // Setzt canvas + framebuffer. Leert dabei die Fläche, darf also nur beim Import/Reset laufen.
    function initDim(w, h) {
        const scale = Math.min(1, RES_LIMIT / Math.max(w, h));
        W = canvas.width = Math.floor(w * scale);
        H = canvas.height = Math.floor(h * scale);
        // framebuffer groesser als die bild-diagonale, sonst schneidet das rotierte bild ab
        FB = Math.ceil(Math.max(W, H) * 1.5);
        offX = (FB - W) / 2;
        offY = (FB - H) / 2;
        fb.width = fb.height = FB;
        ctx.imageSmoothingEnabled = ftx.imageSmoothingEnabled = btx.imageSmoothingEnabled = false;
    }

    // Leerer Zustand: Paper-Fläche mit Mono-Label statt schwarzem Block
    function drawPlaceholder() {
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#E8E5DD';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#0B0B0C';
        const fs = Math.max(14, Math.round(W * 0.035));
        ctx.font = '700 ' + fs + "px 'JetBrains Mono', monospace";
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('NO INPUT', W / 2, H / 2);
    }

    // ------ EFFEKT ------
    // Destruktiv: das canvas ist der zustand, es gibt keinen re-render aus der quelle.
    // Deshalb kein apply()/loop() wie in den anderen units, gerechnet wird nur bei pointermove.

    function rot(x, y, cx, cy, a) {
        const c = Math.cos(a), s = Math.sin(a), dx = x - cx, dy = y - cy;
        return { x: cx + dx * c - dy * s, y: cy + dx * s + dy * c };
    }

    // smear: vollhoehen-streifen senkrecht zur ziehrichtung von vorher nach jetzt kopieren
    function smear(prev, cur) {
        const w = +sliders.brush.value;
        const ang = Math.atan2(cur.y - prev.y, cur.x - prev.x) - Math.PI / 2;
        const a = rot(prev.x, prev.y, W / 2, H / 2, -ang);
        const b = rot(cur.x, cur.y, W / 2, H / 2, -ang);

        // einmal gegen die ziehrichtung drehen, dann liegt der streifen achsenparallel
        ftx.clearRect(0, 0, FB, FB);
        ftx.setTransform(1, 0, 0, 1, FB / 2, FB / 2);
        ftx.rotate(-ang);
        ftx.drawImage(canvas, -FB / 2 + offX, -FB / 2 + offY, W, H);
        ftx.setTransform(1, 0, 0, 1, 0, 0);

        ctx.setTransform(1, 0, 0, 1, W / 2, H / 2);
        ctx.rotate(ang);
        ctx.drawImage(fb, a.x - w / 2 + offX, a.y + offY, w, H, b.x - w / 2 - W / 2, b.y - H / 2, w, H);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    // slide: zeilenband unter dem cursor um dx horizontal verschieben
    function slide(cur, dx) {
        const bh = +sliders.brush.value;
        const y = Math.max(0, Math.min(H - 1, cur.y - bh / 2));
        ftx.clearRect(0, 0, FB, FB);
        ftx.drawImage(canvas, 0, y, W, bh, 0, 0, W, bh);
        ctx.drawImage(fb, 0, 0, W, bh, dx, y, W, bh);
    }

    // stamp: fleck beim druecken merken, dann entlang der bahn stempeln
    function grabStamp(p) {
        const s = +sliders.brush.value;
        buf.width = buf.height = s;
        btx.imageSmoothingEnabled = false;
        btx.drawImage(canvas, p.x - s / 2, p.y - s / 2, s, s, 0, 0, s, s);
    }
    const stampAt = (p) => ctx.drawImage(buf, p.x - buf.width / 2, p.y - buf.height / 2);
    // ------ /EFFEKT ------

    // css-groesse != canvas-groesse, deshalb umrechnen statt offsetX zu nehmen
    function pos(e) {
        const r = canvas.getBoundingClientRect();
        return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
    }

    let down = false, last = null;

    canvas.addEventListener('pointerdown', e => {
        canvas.setPointerCapture(e.pointerId);
        down = true;
        last = pos(e);
        if (mode === 'stamp') { grabStamp(last); stampAt(last); }
    });

    canvas.addEventListener('pointermove', e => {
        if (!down) return;
        const p = pos(e), dx = p.x - last.x, dy = p.y - last.y;
        if (mode === 'stamp') stampAt(p);
        // unter 1px liefert atan2 nur zittern, das sieht aus wie rauschen
        else if (dx * dx + dy * dy >= 1) (mode === 'slide' ? slide(p, dx) : smear(last, p));
        last = p;
    });

    function endStroke() { down = false; last = null; }
    canvas.addEventListener('pointerup', endStroke);
    canvas.addEventListener('pointercancel', endStroke);

    function drawSource(img) {
        currentImage = img;
        sourceMode = 'image';
        initDim(img.width, img.height);
        // deckender grund, sonst schmiert man transparenz zu schwarzen schlieren
        ctx.fillStyle = avgColor(img);
        ctx.fillRect(0, 0, W, H);
        ctx.drawImage(img, 0, 0, W, H);
    }

    // 1x1-downscale ist der billigste weg an die durchschnittsfarbe zu kommen
    function avgColor(img) {
        const t = document.createElement('canvas');
        t.width = t.height = 1;
        const c = t.getContext('2d', { willReadFrequently: true });
        c.drawImage(img, 0, 0, 1, 1);
        const d = c.getImageData(0, 0, 1, 1).data;
        return `rgb(${d[0]},${d[1]},${d[2]})`;
    }

    function loadFile(file) {
        if (!file || !file.type.startsWith('image/')) return;
        if (currentURL) URL.revokeObjectURL(currentURL);
        currentURL = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => drawSource(img);
        img.onerror = () => alert('ERROR: DECODE_FAILED');
        img.src = currentURL;
    }

    fileInput.onchange = (e) => loadFile(e.target.files[0]);

    document.getElementById('btn-reset').onclick = () => {
        if (sourceMode === 'image') drawSource(currentImage);
        else drawPlaceholder();
    };

    const modeBtns = [...document.querySelectorAll('[data-mode]')];
    modeBtns.forEach(b => b.onclick = () => {
        mode = b.dataset.mode;
        modeBtns.forEach(x => x.classList.toggle('active', x === b));
    });

    Object.keys(sliders).forEach(k => {
        sliders[k].oninput = () => {
            document.getElementById('v-' + k).textContent = sliders[k].value;
        };
    });

    btnRec.onclick = function() {
        if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
            this.classList.remove('recording');
            this.textContent = "Record Video";
            document.getElementById('rec-ui').style.display = "none";
        } else {
            recordedChunks = [];
            let types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=h264', 'video/webm'];
            let supportedType = types.find(t => MediaRecorder.isTypeSupported(t));
            if (!supportedType) { alert('ERROR: NO_ENCODER'); return; }
            const streamOut = canvas.captureStream(30);
            mediaRecorder = new MediaRecorder(streamOut, { mimeType: supportedType });
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const extension = supportedType.includes('mp4') ? 'mp4' : 'webm';
                const b = new Blob(recordedChunks, { type: `video/${extension}` });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(b);
                a.download = `DR_PAINT_${Date.now()}.${extension}`;
                a.click();
            };
            mediaRecorder.start();
            this.classList.add('recording');
            this.textContent = "Stop Recording";
            document.getElementById('rec-ui').style.display = "flex";
        }
    };

    // PNG statt JPG: die smear-kanten sind hart, jpg macht daraus matsch
    document.getElementById('btn-save').onclick = () => {
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = `DR_PAINT_${Date.now()}.png`;
        a.click();
    };

    // reinziehen und einfuegen, weil datei-dialog fuer screenshots zu umstaendlich ist
    addEventListener('dragover', e => e.preventDefault());
    addEventListener('drop', e => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); });
    addEventListener('paste', e => {
        for (const it of e.clipboardData.items) if (it.kind === 'file') loadFile(it.getAsFile());
    });

    // Init
    initDim(800, 450);
    drawPlaceholder();
    // Placeholder neu zeichnen sobald der Mono-Font geladen ist
    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => { if (sourceMode === 'none') drawPlaceholder(); });
    }
</script>
</body>
</html>
