<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paint_Unit · Demien Rapp</title>
    <script>
        // eingebettet auf rappde.com/tools? dann ohne titelzeile und credit
        try { if (window.self !== window.top) document.documentElement.classList.add('is-embedded'); } catch (e) { document.documentElement.classList.add('is-embedded'); }
    </script>

    <!-- MANUAL: self-hosted verlangt. Beim Deploy dieses CDN gegen eigene @font-face tauschen. -->

    <style>
        @font-face {
            font-family: "Endless";
            src: url("fonts/Endless.ttf") format("truetype");
            font-display: swap;
        }

        :root {
            --paper: #fff;
            --ink: #000;
            --muted: #595959;
            --soft: #ddd;
            --stage: #000;
            --link: #00e;
            --stroke: 3px;
            --line: 24px;
            --half: 12px;
            --gap: 24px;
            --touch: 44px;
            --controls: 300px;
        }
        @media (max-width: 1023px) { :root { --gap: 18px; } }
        @media (max-width: 767px)  { :root { --gap: 12px; } }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html { background: var(--paper); }
        body {
            margin: 0;
            padding: var(--gap);
            background: var(--paper);
            color: var(--ink);
            font-family: "Endless", Arial, Helvetica, sans-serif;
            font-size: 20px;
            line-height: var(--line);
            -webkit-font-smoothing: none;
        }

        /* titelzeile, nur wenn das tool allein offen ist */
        .topbar {
            border-bottom: var(--stroke) solid var(--ink);
            padding-bottom: var(--half);
            margin-bottom: var(--line);
        }
        .brand {
            margin: 0;
            font-size: 48px;
            line-height: 48px;
            font-weight: 400;
            text-transform: uppercase;
            overflow-wrap: anywhere;
        }
        @media (max-width: 767px) { .brand { font-size: 32px; line-height: 36px; } }

        .container {
            display: grid;
            grid-template-columns: minmax(0, 1fr) var(--controls);
            gap: var(--gap);
            align-items: start;
        }

        /* buehne */
        .viewport {
            position: sticky;
            top: var(--gap);
            background: var(--stage);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 280px;
            overflow: hidden;
        }
        canvas {
            display: block;
            max-width: 100%;
            height: auto;
            max-height: calc(100vh - var(--gap) * 2);
            image-rendering: pixelated;
        }

        .crt-active::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, .25) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        .rec-indicator {
            position: absolute;
            top: var(--half);
            right: var(--half);
            display: none;
            align-items: center;
            gap: 8px;
            z-index: 20;
            background: var(--ink);
            color: var(--paper);
            font-size: 12px;
            line-height: 16px;
            letter-spacing: .12em;
            padding: 4px 8px;
        }
        .rec-indicator::before {
            content: "";
            width: 10px;
            height: 10px;
            background: var(--paper);
            animation: blink 1s steps(1) infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
        @media (prefers-reduced-motion: reduce) { .rec-indicator::before { animation: none; } }

        /* regler */
        .controls {
            border-left: var(--stroke) solid var(--ink);
            padding-left: var(--gap);
            display: flex;
            flex-direction: column;
            gap: var(--line);
        }

        .eyebrow {
            margin: 0 0 var(--half);
            font-size: 14px;
            line-height: 20px;
            font-weight: 400;
            letter-spacing: .1em;
            text-transform: uppercase;
            border-bottom: var(--stroke) solid var(--ink);
            padding-bottom: var(--half);
        }
        .hint { margin: var(--half) 0 0; font-size: 16px; line-height: var(--line); color: var(--muted); }

        .control-item { display: flex; flex-direction: column; }
        .control-item + .control-item { margin-top: var(--half); }
        .control-header {
            display: flex;
            justify-content: space-between;
            gap: var(--half);
            font-size: 12px;
            line-height: 16px;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .control-header .val { color: var(--ink); font-variant-numeric: tabular-nums; }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            display: block;
            width: 100%;
            height: var(--touch);
            margin: 0;
            background: transparent;
            cursor: pointer;
            touch-action: pan-y;
        }
        input[type="range"]::-webkit-slider-runnable-track { height: 3px; background: var(--soft); }
        input[type="range"]::-moz-range-track { height: 3px; background: var(--soft); }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            margin-top: -10.5px;
            background: var(--ink);
            border: 0;
            border-radius: 0;
        }
        input[type="range"]::-moz-range-thumb { width: 24px; height: 24px; background: var(--ink); border: 0; border-radius: 0; }
        input[type="range"]:focus-visible { outline: var(--stroke) solid var(--ink); outline-offset: 3px; }

        .button-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button, .file-label {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: var(--touch);
            padding: 8px 12px;
            margin: 0;
            font: inherit;
            font-size: 14px;
            line-height: 20px;
            letter-spacing: .1em;
            text-transform: uppercase;
            background: var(--paper);
            color: var(--ink);
            border: var(--stroke) solid var(--ink);
            border-radius: 0;
            cursor: pointer;
            position: relative;
        }
        button:hover, .file-label:hover, button.active, button.recording { background: var(--ink); color: var(--paper); }
        button:focus-visible, .file-label:focus-within { outline: var(--stroke) solid var(--ink); outline-offset: 3px; }
        button:disabled { opacity: .35; cursor: not-allowed; }
        button:disabled:hover { background: var(--paper); color: var(--ink); }
        .full-width { grid-column: 1 / -1; }

        /* file-input nicht display:none, sonst per tab nicht erreichbar */
        .file-label input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }

        footer { margin: 0; font-size: 16px; line-height: var(--line); color: var(--muted); }
        footer a { color: var(--link); }

        @media (max-width: 899px) {
            .container { grid-template-columns: 1fr; }
            .viewport { position: relative; top: 0; }
            canvas { max-height: 50vh; }
            .controls { border-left: 0; padding-left: 0; border-top: var(--stroke) solid var(--ink); padding-top: var(--line); }
        }

        /* eingebettet auf rappde.com/tools: der name steht dort schon, das tool fuellt das iframe */
        .is-embedded .topbar, .is-embedded footer { display: none; }
        .is-embedded body { padding: 0; }
        @media (min-width: 900px) {
            .is-embedded, .is-embedded body { height: 100%; }
            .is-embedded body { overflow: hidden; }
            .is-embedded .container { height: 100%; align-items: stretch; }
            .is-embedded .viewport { position: relative; top: 0; }
            .is-embedded canvas { max-height: 100%; }
            .is-embedded .controls { overflow: auto; }
        }
    </style>
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <h1 class="brand">Paint_Unit</h1>
    </div>
</header>

<main class="container">
    <!-- LINKS: BILD -->
    <section class="viewport" id="viewport">
        <div id="rec-ui" class="rec-indicator">REC</div>
        <canvas id="output-canvas"></canvas>
    </section>

    <!-- RECHTS: PARAMETER -->
    <aside class="controls">
        <div>
            <h2 class="eyebrow">Source</h2>
            <div class="button-group">
                <label class="file-label">
                    Import source
                    <input type="file" id="file-input" accept="image/*">
                </label>
                <button id="btn-reset">Reset canvas</button>
            </div>
        </div>

        <div>
            <h2 class="eyebrow">Paint</h2>
            <div class="button-group">
                <button data-mode="smear" class="active">Smear</button>
                <button data-mode="slide">Slide</button>
                <button data-mode="stamp" class="full-width">Stamp</button>
            </div>
            <div class="control-item" style="margin-top:18px">
                <div class="control-header"><span>Brush_Size</span><span class="val" id="v-brush">48</span></div>
                <input type="range" id="s-brush" min="4" max="200" value="48" aria-label="Brush_Size">
            </div>
        </div>

        <div>
            <h2 class="eyebrow">Output</h2>
            <div class="button-group">
                <button id="btn-save">Save still (PNG)</button>
                <button id="btn-rec">Record video</button>
            </div>
        </div>
    </aside>

    <footer>Made by <a href="https://rappde.com">rappde.com</a></footer>
</main>

<script>
    const canvas = document.getElementById('output-canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const fileInput = document.getElementById('file-input');
    const btnRec = document.getElementById('btn-rec');

    // rotations-framebuffer fuer smear/slide
    const fb = document.createElement('canvas');
    const ftx = fb.getContext('2d');
    // stamp-buffer, haelt den fleck vom pointerdown
    const buf = document.createElement('canvas');
    const btx = buf.getContext('2d');

    // captureStream fehlt z.B. auf iOS Safari -> Aufnahme dort ehrlich deaktivieren
    const recSupported = typeof canvas.captureStream === 'function' && typeof window.MediaRecorder === 'function';
    if (!recSupported) {
        btnRec.disabled = true;
        btnRec.textContent = 'Rec n/a';
    }

    // Mobil weniger interne Auflösung -> spürbar flüssiger bei gleichem Look
    const RES_LIMIT = (window.matchMedia('(pointer: coarse)').matches
        || window.matchMedia('(max-width: 900px)').matches) ? 720 : 1200;

    const sliders = {
        brush: document.getElementById('s-brush')
    };

    let sourceMode = 'none';
    let currentImage = null;
    let currentURL = null;
    let mode = 'smear';
    let mediaRecorder, recordedChunks = [];

    let W, H, FB, offX, offY;

    // Setzt canvas + framebuffer. Leert dabei die Fläche, darf also nur beim Import/Reset laufen.
    function initDim(w, h) {
        const scale = Math.min(1, RES_LIMIT / Math.max(w, h));
        W = canvas.width = Math.floor(w * scale);
        H = canvas.height = Math.floor(h * scale);
        // framebuffer groesser als die bild-diagonale, sonst schneidet das rotierte bild ab
        FB = Math.ceil(Math.max(W, H) * 1.5);
        offX = (FB - W) / 2;
        offY = (FB - H) / 2;
        fb.width = fb.height = FB;
        ctx.imageSmoothingEnabled = ftx.imageSmoothingEnabled = btx.imageSmoothingEnabled = false;
    }

    // leerer zustand und meldungen: weiss auf der schwarzen buehne
    function drawPlaceholder(text = 'NO INPUT') {
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        let fs = Math.max(14, Math.round(W * 0.035));
        ctx.font = fs + 'px Endless, Arial, sans-serif';
        while (fs > 10 && ctx.measureText(text).width > W * 0.9) { fs--; ctx.font = fs + 'px Endless, Arial, sans-serif'; }
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, W / 2, H / 2);
    }

    // ------ EFFEKT ------
    // Destruktiv: das canvas ist der zustand, es gibt keinen re-render aus der quelle.
    // Deshalb kein apply()/loop() wie in den anderen units, gerechnet wird nur bei pointermove.

    function rot(x, y, cx, cy, a) {
        const c = Math.cos(a), s = Math.sin(a), dx = x - cx, dy = y - cy;
        return { x: cx + dx * c - dy * s, y: cy + dx * s + dy * c };
    }

    // smear: vollhoehen-streifen senkrecht zur ziehrichtung von vorher nach jetzt kopieren
    function smear(prev, cur) {
        const w = +sliders.brush.value;
        const ang = Math.atan2(cur.y - prev.y, cur.x - prev.x) - Math.PI / 2;
        const a = rot(prev.x, prev.y, W / 2, H / 2, -ang);
        const b = rot(cur.x, cur.y, W / 2, H / 2, -ang);

        // einmal gegen die ziehrichtung drehen, dann liegt der streifen achsenparallel
        ftx.clearRect(0, 0, FB, FB);
        ftx.setTransform(1, 0, 0, 1, FB / 2, FB / 2);
        ftx.rotate(-ang);
        ftx.drawImage(canvas, -FB / 2 + offX, -FB / 2 + offY, W, H);
        ftx.setTransform(1, 0, 0, 1, 0, 0);

        ctx.setTransform(1, 0, 0, 1, W / 2, H / 2);
        ctx.rotate(ang);
        ctx.drawImage(fb, a.x - w / 2 + offX, a.y + offY, w, H, b.x - w / 2 - W / 2, b.y - H / 2, w, H);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    // slide: zeilenband unter dem cursor um dx horizontal verschieben
    function slide(cur, dx) {
        const bh = +sliders.brush.value;
        const y = Math.max(0, Math.min(H - 1, cur.y - bh / 2));
        ftx.clearRect(0, 0, FB, FB);
        ftx.drawImage(canvas, 0, y, W, bh, 0, 0, W, bh);
        ctx.drawImage(fb, 0, 0, W, bh, dx, y, W, bh);
    }

    // stamp: fleck beim druecken merken, dann entlang der bahn stempeln
    function grabStamp(p) {
        const s = +sliders.brush.value;
        buf.width = buf.height = s;
        btx.imageSmoothingEnabled = false;
        btx.drawImage(canvas, p.x - s / 2, p.y - s / 2, s, s, 0, 0, s, s);
    }
    const stampAt = (p) => ctx.drawImage(buf, p.x - buf.width / 2, p.y - buf.height / 2);
    // ------ /EFFEKT ------

    // css-groesse != canvas-groesse, deshalb umrechnen statt offsetX zu nehmen
    function pos(e) {
        const r = canvas.getBoundingClientRect();
        return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
    }

    let down = false, last = null;

    canvas.addEventListener('pointerdown', e => {
        canvas.setPointerCapture(e.pointerId);
        down = true;
        last = pos(e);
        if (mode === 'stamp') { grabStamp(last); stampAt(last); }
    });

    canvas.addEventListener('pointermove', e => {
        if (!down) return;
        const p = pos(e), dx = p.x - last.x, dy = p.y - last.y;
        if (mode === 'stamp') stampAt(p);
        // unter 1px liefert atan2 nur zittern, das sieht aus wie rauschen
        else if (dx * dx + dy * dy >= 1) (mode === 'slide' ? slide(p, dx) : smear(last, p));
        last = p;
    });

    function endStroke() { down = false; last = null; }
    canvas.addEventListener('pointerup', endStroke);
    canvas.addEventListener('pointercancel', endStroke);

    function drawSource(img) {
        currentImage = img;
        sourceMode = 'image';
        initDim(img.width, img.height);
        // deckender grund, sonst schmiert man transparenz zu schwarzen schlieren
        ctx.fillStyle = avgColor(img);
        ctx.fillRect(0, 0, W, H);
        ctx.drawImage(img, 0, 0, W, H);
    }

    // 1x1-downscale ist der billigste weg an die durchschnittsfarbe zu kommen
    function avgColor(img) {
        const t = document.createElement('canvas');
        t.width = t.height = 1;
        const c = t.getContext('2d', { willReadFrequently: true });
        c.drawImage(img, 0, 0, 1, 1);
        const d = c.getImageData(0, 0, 1, 1).data;
        return `rgb(${d[0]},${d[1]},${d[2]})`;
    }

    function loadFile(file) {
        if (!file || !file.type.startsWith('image/')) return;
        if (currentURL) URL.revokeObjectURL(currentURL);
        currentURL = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => drawSource(img);
        img.onerror = () => drawPlaceholder('Could not open this file.');
        img.src = currentURL;
    }

    fileInput.onchange = (e) => loadFile(e.target.files[0]);

    document.getElementById('btn-reset').onclick = () => {
        if (sourceMode === 'image') drawSource(currentImage);
        else drawPlaceholder();
    };

    const modeBtns = [...document.querySelectorAll('[data-mode]')];
    modeBtns.forEach(b => b.onclick = () => {
        mode = b.dataset.mode;
        modeBtns.forEach(x => x.classList.toggle('active', x === b));
    });

    Object.keys(sliders).forEach(k => {
        sliders[k].oninput = () => {
            document.getElementById('v-' + k).textContent = sliders[k].value;
        };
    });

    btnRec.onclick = function() {
        if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
            this.classList.remove('recording');
            this.textContent = "Record video";
            document.getElementById('rec-ui').style.display = "none";
        } else {
            recordedChunks = [];
            let types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=h264', 'video/webm'];
            let supportedType = types.find(t => MediaRecorder.isTypeSupported(t));
            if (!supportedType) { this.textContent = 'Rec n/a'; this.disabled = true; return; }
            const streamOut = canvas.captureStream(30);
            mediaRecorder = new MediaRecorder(streamOut, { mimeType: supportedType });
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const extension = supportedType.includes('mp4') ? 'mp4' : 'webm';
                const b = new Blob(recordedChunks, { type: `video/${extension}` });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(b);
                a.download = `DR_PAINT_${Date.now()}.${extension}`;
                a.click();
            };
            mediaRecorder.start();
            this.classList.add('recording');
            this.textContent = "Stop recording";
            document.getElementById('rec-ui').style.display = "flex";
        }
    };

    // PNG statt JPG: die smear-kanten sind hart, jpg macht daraus matsch
    document.getElementById('btn-save').onclick = () => {
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = `DR_PAINT_${Date.now()}.png`;
        a.click();
    };

    // reinziehen und einfuegen, weil datei-dialog fuer screenshots zu umstaendlich ist
    addEventListener('dragover', e => e.preventDefault());
    addEventListener('drop', e => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); });
    addEventListener('paste', e => {
        for (const it of e.clipboardData.items) if (it.kind === 'file') loadFile(it.getAsFile());
    });

    // Init
    initDim(800, 450);
    drawPlaceholder();
    // placeholder neu zeichnen, sobald die schrift geladen ist
    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => { if (sourceMode === 'none') drawPlaceholder(); });
    }
</script>
</body>
</html>
